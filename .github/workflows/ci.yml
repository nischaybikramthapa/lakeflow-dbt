name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e . pytest
      - run: python -m pytest tests -q
      - name: compile examples
        run: |
          lfd compile --project-dir examples/jaffle_lake
          lfd compile --project-dir examples/layered_shop
          lfd test --project-dir examples/jaffle_lake
          lfd docs generate --project-dir examples/jaffle_lake
